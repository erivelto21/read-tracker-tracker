name: validate and publish

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commit-message:
    if: github.event_name == 'pull_request'
    uses: erivelto21/ci-templates/.github/workflows/validate-pull-request-commit-messages.yml@main
    with:
      commit_range: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  go-validation:
    if: github.event_name == 'pull_request'
    needs:
      - commit-message
    uses: erivelto21/ci-templates/.github/workflows/validate-pull-request-go.yml@main

  debug-publish-vars:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Debug publish vars
        shell: bash
        run: |
          echo "REGISTRY=${{ vars.REGISTRY }}"
          echo "REGISTRY_NAMESPACE=${{ vars.REGISTRY_NAMESPACE }}"
          echo "IMAGE_NAME=${{ vars.IMAGE_NAME }}"

  publish-image:
    if: github.event_name == 'push'
    needs:
      - debug-publish-vars
    uses: erivelto21/ci-templates/.github/workflows/publish-image.yml@main
    with:
      registry: ${{ vars.REGISTRY }}
      namespace: ${{ vars.REGISTRY_NAMESPACE }}
      image_name: ${{ vars.IMAGE_NAME }}
      dockerfile_path: docker/Dockerfile.api
      build_context: .
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - commit-message
      - go-validation

    steps:
      - name: Mark CI complete
        shell: bash
        run: echo "CI passed"
