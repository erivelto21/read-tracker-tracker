name: validate and publish

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commit-message:
    if: github.event_name == 'pull_request'
    uses: erivelto21/ci-templates/.github/workflows/validate-pull-request-commit-messages.yml@main
    with:
      commit_range: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  go-validation:
    if: github.event_name == 'pull_request'
    needs:
      - commit-message
    uses: erivelto21/ci-templates/.github/workflows/validate-pull-request-go.yml@main

  debug-publish-vars:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      registry: ${{ steps.publish-vars.outputs.registry }}
      registry_namespace: ${{ steps.publish-vars.outputs.registry_namespace }}
      image_name: ${{ steps.publish-vars.outputs.image_name }}
    steps:
      - name: Debug publish vars
        id: publish-vars
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          echo "GITHUB_REPOSITORY=${{ github.repository }}"
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"
          echo "GITHUB_REF=${{ github.ref }}"
          echo "GITHUB_ENVIRONMENT=production"
          echo "REGISTRY=${REGISTRY:-<empty>}"
          echo "REGISTRY_NAMESPACE=${REGISTRY_NAMESPACE:-<empty>}"
          echo "IMAGE_NAME=${IMAGE_NAME:-<empty>}"

          missing=false

          if [ -z "$REGISTRY" ]; then
            echo "::error title=Missing REGISTRY::Create REGISTRY as a production environment variable or repository variable in ${{ github.repository }}."
            missing=true
          fi

          if [ -z "$REGISTRY_NAMESPACE" ]; then
            echo "::error title=Missing REGISTRY_NAMESPACE::Create REGISTRY_NAMESPACE as a production environment variable or repository variable in ${{ github.repository }}."
            missing=true
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "::error title=Missing IMAGE_NAME::Create IMAGE_NAME as a production environment variable or repository variable in ${{ github.repository }}."
            missing=true
          fi

          if [ "$missing" = true ]; then
            exit 1
          fi

          echo "registry=$REGISTRY" >>"$GITHUB_OUTPUT"
          echo "registry_namespace=$REGISTRY_NAMESPACE" >>"$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >>"$GITHUB_OUTPUT"

  publish-image:
    if: github.event_name == 'push'
    needs:
      - debug-publish-vars
    uses: erivelto21/ci-templates/.github/workflows/publish-image.yml@main
    with:
      registry: ${{ needs.debug-publish-vars.outputs.registry }}
      namespace: ${{ needs.debug-publish-vars.outputs.registry_namespace }}
      image_name: ${{ needs.debug-publish-vars.outputs.image_name }}
      dockerfile_path: docker/Dockerfile.api
      build_context: .
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - commit-message
      - go-validation

    steps:
      - name: Mark CI complete
        shell: bash
        run: echo "CI passed"
